minVersion: 3.9.0
github:
  owner: getsentry
  repo: devservices
changelog:
  policy: auto
versioning:
  policy: manual
preReleaseCommand: bash scripts/bump-version.sh
targets:
  - name: github
  - name: pypi
  - name: sentry-pypi
    internalPypiRepo: getsentry/pypi

requireNames:
  - /^devservices-darwin$/
  - /^devservices-linux$/
